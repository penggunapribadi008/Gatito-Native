<radialGradient id="r"><stop offset="0" stop-color="#4f6df5" stop-opacity=".55"/><stop offset="1" stop-color="#4f6df5" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="340" rx="28" fill="url(#bg)"/>
