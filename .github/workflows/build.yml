name: Build installer dan APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  installer-pc:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pc
      - name: Build (release)
        run: cargo build --release
      - name: Buat installer
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            $env:Path += ";C:\Program Files (x86)\NSIS"
          }
          makensis /DVERSION=$v installer.nsi
      # archive: false membuat file .exe bisa diunduh langsung, tanpa zip
      - uses: actions/upload-artifact@v7
        with:
          path: pc/gatito-stream-tool-v*.exe
          archive: false

  apk-hp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: bash build-apk.sh
      - uses: actions/upload-artifact@v7
        with:
          path: android/gatito-stream-tool-v*.apk
          archive: false
