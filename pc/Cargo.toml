[package]
name = "gatito-stream-tool"
version = "3.0.3"
edition = "2021"
description = "Gatito: Stream Tool"
authors = ["StreamDeck HP"]
build = "build.rs"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "process"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
hostname = "0.4"
if-addrs = "0.13"
regex = "1"
once_cell = "1"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
crossbeam-channel = "0.5"
rfd = "0.15"
eframe = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
tray-icon = "0.19"
dirs = "5"
single-instance = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
