<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<style>
.k{transform-box:fill-box;transform-origin:center;animation:p 2.6s ease-in-out infinite}
@keyframes p{0%,70%,100%{transform:scale(1);filter:none}80%{transform:scale(.9)}90%{transform:scale(1.06)}}
.t{font:800 84px 'Segoe UI',system-ui,sans-serif;fill:url(#g)}
.s{font:600 23px 'Segoe UI',system-ui,sans-serif;fill:#c9ccd6}
.d{font:500 18px 'Segoe UI',system-ui,sans-serif;fill:#8b90a0}
.glow{animation:gl 5s ease-in-out infinite alternate}
@keyframes gl{from{opacity:.35}to{opacity:.8}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2030"/><stop offset="1" stop-color="#0e0f12"/></linearGradient>
